name: Build plugin jar

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Build plugin
      run: ./gradlew build

    - name: Show jar contents
      run: unzip -l build/libs/*.jar

    - name: Upload plugin jar as artifact
      uses: actions/upload-artifact@v4
      with:
        name: DeathMatch-plugin
        path: build/libs/*.jar
        if-no-files-found: error

    # Кладём собранный jar в Releases, чтобы его можно было скачать одной ссылкой:
    # https://github.com/ayaft1445-eng/hytale-deathmatch/releases/latest
    - name: Publish jar to Releases
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        JARS=$(ls build/libs/*.jar | grep -v -- '-sources.jar' | grep -v -- '-javadoc.jar')
        echo "Публикуем: $JARS"
        gh release delete deathmatch-latest --yes --cleanup-tag || true
        gh release delete deathmatch-old --yes --cleanup-tag || true
        gh release create deathmatch-latest $JARS \
          --target "$GITHUB_SHA" \
          --title "DeathMatch — последняя сборка" \
          --notes "Дезматч для Hytale: чем больше убийств, тем лучше оружие и броня.

        Что делает: игроки, попавшие на арену дезматча (например через карточку мини-игры в меню HubMenu), автоматически входят в бой. За убийства растёт уровень — на каждом уровне выдаётся новый комплект оружия и брони.

        Как поставить: скачайте файл .jar ниже и положите его в папку plugins/ вашего сервера, затем перезапустите сервер. Мод работает и без HubMenu.

        Настройка: README.md в репозитории, команда /dmadmin в игре."
