### Временный workflow: печатает то, что нужно знать про посадку, ввод и камеру
### в сервере Hytale для мода машин. Запускается при изменении самого файла
### и вручную. После исследования удаляется.
name: BeepBeep API dump

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/beepbeep-api-dump.yml']

jobs:
  decompiled:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - uses: gradle/actions/setup-gradle@v5
    - name: Build (подтягивает сервер)
      continue-on-error: true
      run: ./gradlew build
    - name: Декомпиляция (раунд 2)
      run: |
        set +e
        JAR=$(find ~/.gradle/caches -name 'Server-*.jar' ! -name '*sources*' ! -name '*javadoc*' | head -1)
        curl -sSL -o /tmp/vf.jar https://repo1.maven.org/maven2/org/vineflower/vineflower/1.11.1/vineflower-1.11.1.jar
        mkdir -p /tmp/cls /tmp/src && cd /tmp/cls
        unzip -q -o "$JAR" 'com/hypixel/hytale/server/core/modules/entity/teleport/*' \
          'com/hypixel/hytale/server/core/modules/entity/player/PlayerSystems*' \
          'com/hypixel/hytale/server/core/entity/entities/player/movement/MovementManager*'
        java -jar /tmp/vf.jar -dgs=1 -rsy=1 /tmp/cls /tmp/src > /dev/null 2>&1
        cd /tmp/src
        for f in $(find . -name '*.java' | sort); do echo "######## $f"; grep -v '^import' "$f"; done
    - name: Сигнатуры (javap)
      run: |
        set +e
        JAR=$(find ~/.gradle/caches -name 'Server-*.jar' ! -name '*sources*' ! -name '*javadoc*' | head -1)
        for c in com.hypixel.hytale.server.core.entity.InteractionContext \
                 com.hypixel.hytale.server.core.modules.interaction.interaction.config.SimpleInstantInteraction \
                 com.hypixel.hytale.server.core.modules.interaction.interaction.config.SimpleInteraction \
                 com.hypixel.hytale.server.core.modules.interaction.interaction.config.Interaction \
                 com.hypixel.hytale.server.core.modules.interaction.interaction.config.RootInteraction \
                 com.hypixel.hytale.server.core.modules.interaction.interaction.util.InteractionValidation \
                 com.hypixel.hytale.server.core.modules.interaction.interaction.CooldownHandler \
                 com.hypixel.hytale.assetstore.AssetRegistry com.hypixel.hytale.assetstore.AssetStore \
                 com.hypixel.hytale.server.core.plugin.PluginBase com.hypixel.hytale.server.core.plugin.JavaPlugin \
                 com.hypixel.hytale.server.core.modules.entity.component.Intangible \
                 com.hypixel.hytale.server.core.modules.entity.component.Invulnerable \
                 com.hypixel.hytale.server.core.modules.entity.component.BoundingBox \
                 com.hypixel.hytale.server.core.modules.entity.component.TransformComponent \
                 com.hypixel.hytale.server.core.universe.world.storage.EntityStore \
                 com.hypixel.hytale.server.core.event.EventRegistry \
                 com.hypixel.hytale.server.core.modules.entity.damage.DeathSystems\$OnDeathSystem \
                 com.hypixel.hytale.server.core.modules.entity.component.Spectating \
                 com.hypixel.hytale.server.core.modules.entity.player.PlayerSystems\$ProcessPlayerInput \
                 com.hypixel.hytale.server.core.modules.entity.system.TransformSystems\$EntityTrackerUpdate \
                 com.hypixel.hytale.math.vector.Rotation3f com.hypixel.hytale.math.shape.Box \
                 com.hypixel.hytale.component.system.tick.EntityTickingSystem \
                 com.hypixel.hytale.component.dependency.SystemGroupDependency \
                 com.hypixel.hytale.component.CommandBuffer com.hypixel.hytale.component.Store; do
          echo "######## $c"
          javap -cp "$JAR" -p "$c" 2>&1 | grep -v -E 'lambda\$|^Compiled from' | head -120
        done
