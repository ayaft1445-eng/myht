# Сборка отдельного мода «Дезматч», который лежит в папке deathmatch/.
#
# Мод живёт здесь временно: у него будет свой репозиторий, а пока сборка и
# релиз идут отсюда, чтобы jar можно было скачать одной ссылкой.
name: Build deathmatch jar

on:
  push:
    branches: [ "**" ]
    paths:
      - 'deathmatch/**'
      - '.github/workflows/deathmatch.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: deathmatch
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Build plugin
      run: ./gradlew build

    - name: Show jar contents
      run: unzip -l build/libs/*.jar

    - name: Upload plugin jar as artifact
      uses: actions/upload-artifact@v4
      with:
        name: DeathMatch-plugin
        path: deathmatch/build/libs/*.jar
        if-no-files-found: error

    - name: Publish jar to Releases
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        JARS=$(ls build/libs/*.jar | grep -v -- '-sources.jar' | grep -v -- '-javadoc.jar')
        echo "Публикуем: $JARS"
        gh release delete deathmatch-latest --yes --cleanup-tag || true
        gh release create deathmatch-latest $JARS \
          --target "$GITHUB_SHA" \
          --title "DeathMatch — последняя сборка" \
          --notes "Дезматч: чем больше убийств, тем лучше оружие и броня.

        Что делает: игроки на арене дерутся, за убийства растёт уровень — на 0, 10, 20 и 30 убийствах выдаётся новый комплект оружия и брони. Арена задаётся точкой и радиусом, поэтому карточка мини-игры в меню HubMenu может приводить игроков прямо в бой.

        Как поставить: скачайте .jar ниже, положите в папку plugins/ сервера и перезапустите его. Затем в игре: /dmadmin — стать админом, /dmsetarena — поставить точку арены.

        Настройка: deathmatch/README.md в репозитории."
