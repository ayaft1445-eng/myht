# Сборка мода с бронёй ArmorSets, который лежит в папке armor/
#
# Каждый пуш в эту папку собирает jar против настоящего сервера Hytale
# и выкладывает его в релиз armorsets-latest.
name: Build ArmorSets

on:
  push:
    branches: [ "**" ]
    paths:
      - 'armor/**'
      - '.github/workflows/armor.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: armor
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Build plugin
      run: ./gradlew build --console=plain

    - name: Show jar contents
      run: unzip -l build/libs/*.jar

    - name: Upload plugin jar as artifact
      uses: actions/upload-artifact@v4
      with:
        name: ArmorSets
        path: armor/build/libs/*.jar
        if-no-files-found: error

    # Если у токена Actions нет права писать релизы (Settings → Actions →
    # Workflow permissions), jar остаётся в артефакте сборки, а сборка зелёной.
    - name: Publish jar to Releases
      if: github.event_name == 'push'
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        JARS=$(ls build/libs/*.jar | grep -v -- '-sources.jar' | grep -v -- '-javadoc.jar')
        echo "Публикуем: $JARS"
        gh release delete armorsets-latest --yes --cleanup-tag || true
        gh release create armorsets-latest $JARS \
          --target "$GITHUB_SHA" \
          --title "ArmorSets — последняя сборка" \
          --notes "Белый и красный комплекты брони для Hytale: шлем, кираса, перчатки, поножи.

        Как поставить: скачайте .jar ниже, положите в папку mods/ сервера (или своего мира) и перезапустите. Броня крафтится на верстаке бронника (Armor_Bench) из бронзовых слитков, дерева и лёгкой кожи; в творческом режиме — из библиотеки предметов; или командой /give <игрок> Armor_White_Chest (Head, Chest, Hands, Legs; White или Red)."
