# Временный workflow: ищем настоящие идентификаторы предметов Hytale.
name: API dump

on:
  push:
    paths:
      - '.github/workflows/api-dump.yml'
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
    - name: Build
      run: ./gradlew build || true

    - name: Байт-код getItem — откуда берётся предмет
      run: |
        set +e
        CP=$(find ~/.gradle/caches -name '*.jar' | grep -iv sources | grep -i hytale | tr '\n' ':')
        echo "@@@ GETITEM-BYTECODE"
        javap -c -p -cp "$CP" com.hypixel.hytale.server.core.inventory.ItemStack 2>/dev/null \
          | awk '/public com.hypixel.hytale.server.core.asset.type.item.config.Item getItem/,/^$/' | head -30
        echo "@@@ ASSET-HOLDERS"
        JAR=$(find ~/.gradle/caches -name 'Server-*.jar' | head -1)
        unzip -l "$JAR" | awk '{print $4}' | grep -iE 'asset/(Assets|AssetMaps|CommonAsset|ServerAsset)[A-Za-z]*\.class' | head -10
