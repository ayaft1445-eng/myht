### Временный workflow: печатает API сервера Hytale, чтобы писать код по фактическим
### сигнатурам, а не наугад. Запускается вручную (Actions -> Dump Hytale API -> Run workflow).
### После того как нужное выяснено, файл можно удалить.
name: Dump Hytale API

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/api-dump.yml']

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Build (подтягивает зависимости сервера)
      run: ./gradlew build

    - name: Сигнатуры
      run: |
        set +e
        CP=$(find ~/.gradle/caches -name '*.jar' | grep -iv sources | grep -i hytale | tr '\n' ':')
        for C in \
          com.hypixel.hytale.server.core.universe.world.storage.EntityStore \
          com.hypixel.hytale.component.Holder \
          com.hypixel.hytale.component.Ref \
          com.hypixel.hytale.component.Store ; do
          echo "════════ $C"
          javap -cp "$CP" "$C" 2>&1 | head -18
        done
        echo "════════ Entity: мир и store"
        javap -cp "$CP" com.hypixel.hytale.server.core.entity.Entity 2>&1 | grep -iE 'world|store|Ref\b' | head -15
        echo "════════ PlayerReadyEvent + PlayerEvent"
        javap -cp "$CP" com.hypixel.hytale.server.core.event.events.player.PlayerRefEvent 2>&1 | head -12
