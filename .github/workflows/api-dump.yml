### Временный workflow: печатает API сервера Hytale, чтобы писать код по фактическим
### сигнатурам, а не наугад. Запускается вручную (Actions -> Dump Hytale API -> Run workflow).
### После того как нужное выяснено, файл можно удалить.
name: Dump Hytale API

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/api-dump.yml']

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Build (подтягивает зависимости сервера)
      run: ./gradlew build

    - name: Пакет событий
      run: |
        set +e
        JAR=$(find ~/.gradle/caches -name 'Server-*.jar' | head -1)
        unzip -l "$JAR" | awk '{print $4}' | grep -E '^com/hypixel/hytale/event/' | grep -v '\$' | head -40

    - name: Сигнатуры
      run: |
        set +e
        CP=$(find ~/.gradle/caches -name '*.jar' | grep -iv sources | grep -i hytale | tr '\n' ':')
        for C in \
          com.hypixel.hytale.event.EventRegistry \
          com.hypixel.hytale.event.IEvent \
          com.hypixel.hytale.server.core.entity.entities.player.pages.InteractiveCustomUIPage \
          com.hypixel.hytale.server.core.entity.entities.player.pages.CustomUIPage ; do
          echo "════════ $C"
          javap -cp "$CP" "$C" 2>&1 | head -45
        done
        echo "════════ World (хранилище сущностей)"
        javap -cp "$CP" com.hypixel.hytale.server.core.universe.world.World 2>&1 | grep -iE 'store|getEntity' | head -20
