# Временный workflow: печатает сигнатуры серверного API для нового мода.
name: API dump

on:
  push:
    paths:
      - '.github/workflows/api-dump.yml'
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
    - name: Build
      run: ./gradlew build || true

    - name: ComponentRegistryProxy и задачи
      run: |
        set +e
        CP=$(find ~/.gradle/caches -name '*.jar' | grep -iv sources | grep -i hytale | tr '\n' ':')
        echo "@@@ PROXY"
        javap -cp "$CP" com.hypixel.hytale.component.ComponentRegistryProxy 2>&1 | grep -iE 'class |system|register' | head -20
        echo "@@@ TASKREGISTRY"
        javap -cp "$CP" com.hypixel.hytale.server.core.task.TaskRegistry 2>&1 | grep -iE 'class |public' | head -20
        echo "@@@ WORLD-PLAYERS"
        javap -cp "$CP" com.hypixel.hytale.server.core.universe.world.World 2>&1 | grep -iE 'getPlayers|forEachPlayer|getStore|execute|schedule' | head -14
