# Временный workflow: ищем настоящие идентификаторы предметов Hytale.
name: API dump

on:
  push:
    paths:
      - '.github/workflows/api-dump.yml'
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
    - name: Build
      run: ./gradlew build || true

    - name: Как добраться до списка предметов
      run: |
        set +e
        CP=$(find ~/.gradle/caches -name '*.jar' | grep -iv sources | grep -i hytale | tr '\n' ':')
        echo "@@@ ITEM-ALL"
        javap -cp "$CP" com.hypixel.hytale.server.core.asset.type.item.config.Item 2>&1 | head -45
        echo "@@@ JSONASSET"
        javap -cp "$CP" com.hypixel.hytale.assetstore.JsonAsset 2>&1 | head -15
        echo "@@@ ASSETSTORE"
        javap -cp "$CP" com.hypixel.hytale.assetstore.AssetStore 2>&1 | grep -E 'class|public|static' | head -25
