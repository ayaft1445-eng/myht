### Временный workflow: печатает API сервера Hytale, чтобы писать код по фактическим
### сигнатурам, а не наугад. Запускается вручную (Actions -> Dump Hytale API -> Run workflow).
### После того как нужное выяснено, файл можно удалить.
name: Dump Hytale API

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Build (подтягивает зависимости сервера)
      run: ./gradlew build

    - name: Найти jar сервера
      run: |
        find ~/.gradle/caches -name '*.jar' 2>/dev/null | grep -iv sources | grep -i hytale | head -40
        find . -name '*.jar' 2>/dev/null | grep -iv "build/libs" | head -40

    - name: Классы событий и подключения игрока
      run: |
        set +e
        for JAR in $(find ~/.gradle/caches -name '*.jar' 2>/dev/null | grep -iv sources | grep -i hytale); do
          echo "=== $JAR"
          unzip -l "$JAR" | grep -iE 'Event|Listener|Join|Connect|Session' | grep -v '\$' | head -60
        done

    - name: Сигнатуры ключевых классов
      run: |
        set +e
        CP=$(find ~/.gradle/caches -name '*.jar' 2>/dev/null | grep -iv sources | grep -i hytale | tr '\n' ':')
        for C in \
          com.hypixel.hytale.server.core.plugin.JavaPlugin \
          com.hypixel.hytale.server.core.plugin.JavaPluginInit \
          com.hypixel.hytale.server.core.universe.PlayerRef \
          com.hypixel.hytale.server.core.entity.entities.Player \
          com.hypixel.hytale.server.core.entity.entities.player.pages.PageManager \
          com.hypixel.hytale.server.core.ui.builder.UICommandBuilder ; do
          echo "════════ $C"
          javap -cp "$CP" "$C" | head -70
        done
