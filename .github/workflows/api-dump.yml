### Временный workflow: печатает то, что нужно узнать про API сервера Hytale.
name: Dump Hytale API

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/api-dump.yml']

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - uses: gradle/actions/setup-gradle@v5
    - name: Build (подтягивает зависимости сервера)
      continue-on-error: true
      run: ./gradlew build
    - name: Папка предметов
      run: |
        set +e
        JAR=$(find ~/.gradle/caches -name 'Server-*.jar' | head -1)
        mkdir -p /tmp/srv && unzip -oq "$JAR" -d /tmp/srv
        cd /tmp/srv
        echo "════════ строки Item/... в классах"
        grep -rhao --include='*.class' -E 'Item/[A-Za-z/]+' . | sort | uniq -c | sort -rn | head -30
        echo "════════ кто регистрирует Item.class"
        for f in $(grep -rla --include='*.class' 'Item/Items' . | head -5); do
          c=$(echo "$f" | sed 's#^\./##; s/\.class$//; s#/#.#g'); echo "== $c"
          javap -cp /tmp/srv -c -p "$c" | grep -B8 -A3 'Item/Items' | grep -E 'ldc|setPath' | head -12
        done
