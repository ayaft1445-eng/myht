# Временный workflow: печатает сигнатуры серверного API для нового мода.
name: API dump

on:
  push:
    paths:
      - '.github/workflows/api-dump.yml'
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
    - name: Build
      run: ./gradlew build || true

    - name: Точечные сигнатуры
      run: |
        set +e
        CP=$(find ~/.gradle/caches -name '*.jar' | grep -iv sources | grep -i hytale | tr '\n' ':')
        JAR=$(find ~/.gradle/caches -name 'Server-*.jar' | head -1)

        echo "@@@ KILLFEED-CLASSES"
        unzip -l "$JAR" | awk '{print $4}' | grep -iE 'KillFeed|Death' | head -12

        echo "@@@ KILLFEED"
        javap -cp "$CP" 'com.hypixel.hytale.server.core.modules.entity.damage.event.KillFeedEvent$KillerMessage' 2>&1 | grep -E 'class|public' | head -12

        echo "@@@ DAMAGE"
        javap -cp "$CP" com.hypixel.hytale.server.core.modules.entity.damage.Damage 2>&1 | grep -iE 'class |getSource|getAmount|getDeathMessage' | head -10

        echo "@@@ DAMAGE-SOURCE"
        javap -cp "$CP" 'com.hypixel.hytale.server.core.modules.entity.damage.Damage$Source' 2>&1 | grep -E 'class|public' | head -20

        echo "@@@ ENTITY-EVENT-SYSTEM"
        javap -cp "$CP" com.hypixel.hytale.component.system.EntityEventSystem 2>&1 | grep -E 'class|public|protected' | head -12

        echo "@@@ JAVAPLUGIN-REGISTRY"
        javap -cp "$CP" com.hypixel.hytale.server.core.plugin.JavaPlugin 2>&1 | grep -iE 'registry|system|DataDirectory|Logger' | head -14

        echo "@@@ LIVINGENTITY-INVENTORY"
        javap -cp "$CP" com.hypixel.hytale.server.core.entity.LivingEntity 2>&1 | grep -iE 'getInventory|setInventory|health' | head -12

        echo "@@@ ARCHETYPE"
        javap -cp "$CP" com.hypixel.hytale.component.Archetype 2>&1 | grep -E 'empty|class' | head -6

        echo "@@@ ENTITYSTOREREGISTRY"
        CLS=$(unzip -l "$JAR" | awk '{print $4}' | grep -iE 'EntityStoreRegistry|StoreRegistry' | grep -v '\$' | head -3)
        echo "$CLS"
        for c in $CLS; do
          n=$(echo "$c" | sed 's|/|.|g; s|\.class$||')
          echo "---- $n"
          javap -cp "$CP" "$n" 2>&1 | grep -iE 'registerSystem|class ' | head -8
        done
