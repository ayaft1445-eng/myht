### Временный workflow: печатает то, что нужно узнать про API сервера Hytale.
### Запускается при изменении самого файла и вручную. Потом удаляется.
name: Dump Hytale API

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/api-dump.yml']

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - uses: gradle/actions/setup-gradle@v5
    - name: Build (подтягивает зависимости сервера)
      continue-on-error: true
      run: ./gradlew build
    - name: Папка анимаций эмоций и меню
      run: |
        set +e
        JAR=$(find ~/.gradle/caches -name 'Server-*.jar' | head -1)
        echo "════════ CommonAssetValidator хвост"
        javap -cp "$JAR" -c -p com.hypixel.hytale.server.core.asset.common.CommonAssetValidator | sed -n '/static {}/,$p' | grep -E 'ldc|putstatic' | tail -45
        echo "════════ CosmeticsModule — всё про EmoteAsset"
        javap -cp "$JAR" -c -p com.hypixel.hytale.server.core.cosmetics.CosmeticsModule > /tmp/cm.txt
        grep -n -E '^  [a-z].*\(|EmoteAsset|Emote|ldc' /tmp/cm.txt | sed -n '1,400p' | grep -v 'String [a-z ]*$' | head -150
        echo "════════ GamePacketHandler.handlePlayEmote"
        javap -cp "$JAR" -c -p com.hypixel.hytale.server.core.io.handlers.game.GamePacketHandler | sed -n '/handlePlayEmote/,/^$/p' | head -80
