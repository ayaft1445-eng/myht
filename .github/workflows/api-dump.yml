# Временный workflow: ищем настоящие идентификаторы предметов Hytale.
name: API dump

on:
  push:
    paths:
      - '.github/workflows/api-dump.yml'
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
    - name: Build
      run: ./gradlew build || true

    - name: Хранилище ассетов предметов
      run: |
        set +e
        CP=$(find ~/.gradle/caches -name '*.jar' | grep -iv sources | grep -i hytale | tr '\n' ':')
        JAR=$(find ~/.gradle/caches -name 'Server-*.jar' | head -1)

        echo "@@@ ITEM-FULL"
        javap -cp "$CP" com.hypixel.hytale.server.core.asset.type.item.config.Item 2>&1 | grep -iE 'static|map|getKey|getId' | head -20

        echo "@@@ ASSETMAP-CLASSES"
        unzip -l "$JAR" | awk '{print $4}' | grep -iE 'assetstore/map/|asset/.*Store' | grep -v '\$' | head -15

        echo "@@@ DEFAULT-ASSET-MAP"
        javap -cp "$CP" com.hypixel.hytale.assetstore.map.DefaultAssetMap 2>&1 | grep -E 'class|public' | head -20

        echo "@@@ JSONASSETWITHMAP"
        javap -cp "$CP" com.hypixel.hytale.assetstore.map.JsonAssetWithMap 2>&1 | grep -E 'class|public' | head -12

        echo "@@@ ASSET-LOOKUP"
        for n in $(unzip -l "$JAR" | awk '{print $4}' | grep -iE 'asset/(Asset|Common)?[A-Za-z]*Store\.class|asset/Assets\.class' | sed 's|/|.|g; s|\.class$||' | head -6); do
          echo "---- $n"
          javap -cp "$CP" "$n" 2>&1 | grep -iE 'class |item|get' | head -10
        done
