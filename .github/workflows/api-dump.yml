# Временный workflow: печатает сигнатуры серверного API для нового мода.
# Удаляется, как только дамп снят.
name: API dump

on:
  push:
    paths:
      - '.github/workflows/api-dump.yml'
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Build (подтягивает зависимости сервера)
      run: ./gradlew build || true

    - name: Классы урона, убийств и инвентаря
      run: |
        set +e
        JAR=$(find ~/.gradle/caches -name 'Server-*.jar' | head -1)
        echo "JAR=$JAR"
        echo "──────── damage"
        unzip -l "$JAR" | awk '{print $4}' | grep -E 'entity/damage/' | head -40
        echo "──────── inventory"
        unzip -l "$JAR" | awk '{print $4}' | grep -E 'core/inventory/' | grep -v '\$' | head -40
        echo "──────── ecs system"
        unzip -l "$JAR" | awk '{print $4}' | grep -iE 'component/system/' | grep -v '\$' | head -30
        echo "──────── death/respawn"
        unzip -l "$JAR" | awk '{print $4}' | grep -iE 'death|respawn|killfeed' | head -30

    - name: Сигнатуры
      run: |
        set +e
        CP=$(find ~/.gradle/caches -name '*.jar' | grep -iv sources | grep -i hytale | tr '\n' ':')
        for C in \
          com.hypixel.hytale.server.core.modules.entity.damage.event.KillFeedEvent \
          com.hypixel.hytale.server.core.modules.entity.damage.event.KillFeedEvent\$KillerMessage \
          com.hypixel.hytale.server.core.modules.entity.damage.Damage \
          com.hypixel.hytale.server.core.modules.entity.damage.Damage\$Source \
          com.hypixel.hytale.component.system.EntityEventSystem \
          com.hypixel.hytale.server.core.plugin.JavaPlugin \
          com.hypixel.hytale.server.core.inventory.Inventory \
          com.hypixel.hytale.server.core.inventory.ItemStack \
          com.hypixel.hytale.server.core.inventory.container.ItemContainer \
          com.hypixel.hytale.server.core.entity.entities.Player \
          com.hypixel.hytale.server.core.universe.PlayerRef ; do
          echo "════════ $C"
          javap -cp "$CP" "$C" 2>&1 | head -60
        done
