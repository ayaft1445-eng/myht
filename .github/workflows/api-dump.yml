# Временный workflow: печатает сигнатуры серверного API для нового мода.
name: API dump

on:
  push:
    paths:
      - '.github/workflows/api-dump.yml'
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
    - name: Build
      run: ./gradlew build || true

    - name: ArchetypeChunk и источник урона
      run: |
        set +e
        CP=$(find ~/.gradle/caches -name '*.jar' | grep -iv sources | grep -i hytale | tr '\n' ':')
        JAR=$(find ~/.gradle/caches -name 'Server-*.jar' | head -1)
        echo "@@@ CHUNK"
        javap -cp "$CP" com.hypixel.hytale.component.ArchetypeChunk 2>&1 | grep -iE 'class |getRef|getEntity|get\(|getComponent' | head -20
        echo "@@@ SOURCE-IMPLS"
        unzip -l "$JAR" | awk '{print $4}' | grep -iE 'damage/source|DamageSource' | head -15
        echo "@@@ SOURCE-INNER"
        javap -cp "$CP" 'com.hypixel.hytale.server.core.modules.entity.damage.Damage$Source' 2>&1 | head -20
        echo "@@@ ENTITY-SOURCE"
        for n in $(unzip -l "$JAR" | awk '{print $4}' | grep -iE 'damage/.*Source' | sed 's|/|.|g; s|\.class$||' | head -8); do
          echo "---- $n"
          javap -cp "$CP" "$n" 2>&1 | grep -iE 'class |Ref|getEntity|public' | head -8
        done
