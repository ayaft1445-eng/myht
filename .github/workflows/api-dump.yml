### Временный workflow: печатает то, что нужно узнать про API сервера Hytale.
### Запускается при изменении самого файла и вручную. Потом удаляется.
name: Dump Hytale API

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/api-dump.yml']

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - uses: gradle/actions/setup-gradle@v5
    - name: Build (подтягивает зависимости сервера)
      continue-on-error: true
      run: ./gradlew build
    - name: Валидаторы EmoteAsset
      run: |
        set +e
        JAR=$(find ~/.gradle/caches -name 'Server-*.jar' | head -1)
        echo "════════ EmoteAsset <clinit>"
        javap -cp "$JAR" -c -p com.hypixel.hytale.server.core.cosmetics.EmoteAsset | sed -n '/static {}/,$p' | head -140
        echo "════════ CommonAssetValidator"
        javap -cp "$JAR" -c -p com.hypixel.hytale.server.core.asset.common.CommonAssetValidator | grep -E 'public|static|ldc|getstatic|putstatic' | head -120
        echo "════════ CosmeticsModule setup + emotes"
        javap -cp "$JAR" -c -p com.hypixel.hytale.server.core.cosmetics.CosmeticsModule | sed -n '1,120p'
        javap -cp "$JAR" -c -p com.hypixel.hytale.server.core.cosmetics.CosmeticsModule | grep -n -B30 -A40 'anewarray.*EmoteAsset' | head -120
