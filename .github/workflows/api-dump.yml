### Временный workflow: печатает API сервера Hytale, чтобы писать код по фактическим
### сигнатурам, а не наугад. Запускается вручную (Actions -> Dump Hytale API -> Run workflow).
### После того как нужное выяснено, файл можно удалить.
name: Dump Hytale API

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/api-dump.yml']

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Build (подтягивает зависимости сервера)
      run: ./gradlew build

    - name: Что есть в пакете событий
      run: |
        set +e
        JAR=$(find ~/.gradle/caches -name 'Server-*.jar' | head -1)
        echo "JAR=$JAR"
        unzip -l "$JAR" | awk '{print $4}' | grep -E 'server/core/event/' | grep -v '\$' | head -60
        unzip -l "$JAR" | awk '{print $4}' | grep -iE 'plugin/(PluginBase|PluginInit|PluginManager)' | head -20

    - name: Сигнатуры
      run: |
        set +e
        CP=$(find ~/.gradle/caches -name '*.jar' | grep -iv sources | grep -i hytale | tr '\n' ':')
        for C in \
          com.hypixel.hytale.server.core.plugin.PluginBase \
          com.hypixel.hytale.server.core.event.EventRegistry \
          com.hypixel.hytale.server.core.event.EventBus \
          com.hypixel.hytale.server.core.event.EventManager \
          com.hypixel.hytale.server.core.event.Event \
          com.hypixel.hytale.server.core.event.events.player.PlayerReadyEvent \
          com.hypixel.hytale.server.core.event.events.player.PlayerEvent \
          com.hypixel.hytale.server.core.event.events.player.AddPlayerToWorldEvent ; do
          echo "════════ $C"
          javap -cp "$CP" "$C" 2>&1 | head -40
        done
