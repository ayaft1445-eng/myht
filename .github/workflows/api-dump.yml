# Временный workflow: печатает сигнатуры серверного API для нового мода.
name: API dump

on:
  push:
    paths:
      - '.github/workflows/api-dump.yml'
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
    - name: Build
      run: ./gradlew build || true

    - name: Как регистрируется ECS-система
      run: |
        set +e
        CP=$(find ~/.gradle/caches -name '*.jar' | grep -iv sources | grep -i hytale | tr '\n' ':')
        JAR=$(find ~/.gradle/caches -name 'Server-*.jar' | head -1)

        echo "@@@ JAVAPLUGIN"
        javap -cp "$CP" com.hypixel.hytale.server.core.plugin.JavaPlugin 2>&1 | head -40

        echo "@@@ PLUGINBASE"
        javap -cp "$CP" com.hypixel.hytale.server.core.plugin.PluginBase 2>&1 | head -40

        echo "@@@ REGISTRY-CLASSES"
        unzip -l "$JAR" | awk '{print $4}' | grep -iE 'Registry\.class' | grep -v '\$' | head -25

        echo "@@@ WHO-HAS-registerSystem"
        for n in $(unzip -l "$JAR" | awk '{print $4}' | grep -iE 'registry|systems?\.class' | grep -v '\$' | sed 's|/|.|g; s|\.class$||' | head -40); do
          out=$(javap -cp "$CP" "$n" 2>/dev/null | grep -i 'registerSystem' | head -3)
          if [ -n "$out" ]; then echo "---- $n"; echo "$out"; fi
        done
