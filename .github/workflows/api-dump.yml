### Временный workflow: печатает то, что нужно узнать про API сервера Hytale.
### Запускается при изменении самого файла и вручную. Потом удаляется.
name: Dump Hytale API

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/api-dump.yml']

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Build (подтягивает зависимости сервера)
      continue-on-error: true
      run: ./gradlew build

    - name: Ищем следы шрифтов в jar
      run: |
        set +e
        JAR=$(find ~/.gradle/caches -name 'Server-*.jar' | head -1)
        mkdir -p /tmp/srv && unzip -oq "$JAR" -d /tmp/srv
        echo "──────── строки .ttf / .otf / Fonts/ внутри классов"
        grep -ria --include='*.class' -o -E '[A-Za-z0-9_/.-]*\.(ttf|otf)' /tmp/srv | sort -u | head -20
        grep -ria --include='*.class' -o -E 'Fonts?/[A-Za-z0-9_/.-]*' /tmp/srv | sort -u | head -20
        echo "──────── строки со словом Font в константах классов"
        grep -ria --include='*.class' -o -E '[A-Za-z]{0,12}Font[A-Za-z]{0,14}' /tmp/srv | sed 's/^.*://' | sort | uniq -c | sort -rn | head -25
        echo "──────── типы ассетов, которые знает редактор"
        javap -cp "$JAR" -constants com.hypixel.hytale.protocol.packets.asseteditor.AssetEditorAssetType 2>&1 | head -40

    - name: Как выглядит разметка UI со стороны сервера
      run: |
        set +e
        JAR=$(find ~/.gradle/caches -name 'Server-*.jar' | head -1)
        echo "──────── встроенные .ui в сервере (если есть)"
        unzip -l "$JAR" | grep -i '\.ui' | head -20
        echo "──────── классы про CustomUI"
        unzip -l "$JAR" | awk '{print $4}' | grep -iE 'CustomUI|interface_/' | grep -v '\$' | head -25
