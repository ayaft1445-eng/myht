### Временный workflow: печатает то, что нужно узнать про API сервера Hytale.
### Запускается при изменении самого файла и вручную. Потом удаляется.
name: Dump Hytale API

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/api-dump.yml']

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - uses: gradle/actions/setup-gradle@v5
    - name: Build (подтягивает зависимости сервера)
      continue-on-error: true
      run: ./gradlew build
    - name: Где регистрируется EmoteAsset
      run: |
        set +e
        JAR=$(find ~/.gradle/caches -name 'Server-*.jar' | head -1)
        mkdir -p /tmp/srv && unzip -oq "$JAR" -d /tmp/srv
        cd /tmp/srv
        for f in $(grep -rla --include='*.class' -E 'cosmetics/EmoteAsset|getEmotesInGame|PlayEmote' . | grep -v 'protocol/' ); do
          c=$(echo "$f" | sed 's#^\./##; s/\.class$//; s#/#.#g')
          echo "════════ $c"
          javap -cp /tmp/srv -c -p "$c" | grep -nE 'ldc|EmoteAsset|Emote|setPath|Path|invoke.*(build|register|setPath|loadsAfter)' | grep -vE 'lambda\$' | head -80
        done
        echo "──────── строки путей ассетов (setPath) в загрузчике"
        for c in $(grep -rla --include='*.class' 'setPath' com/hypixel/hytale/server/core/asset | head -5 | sed 's#^\./##; s/\.class$//; s#/#.#g'); do echo "== $c"; javap -cp /tmp/srv -c -p "$c" | grep -B3 'setPath' | grep ldc | head -80; done
