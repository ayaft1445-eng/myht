### Временный workflow: печатает то, что нужно узнать про API сервера Hytale.
### Запускается при изменении самого файла и вручную. Потом удаляется.
name: Dump Hytale API

on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/api-dump.yml']

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Build (подтягивает зависимости сервера)
      continue-on-error: true
      run: ./gradlew build

    - name: Классы про шрифты и стили текста
      run: |
        set +e
        JAR=$(find ~/.gradle/caches -name 'Server-*.jar' | head -1)
        echo "JAR=$JAR"
        echo "──────── классы со словом Font"
        unzip -l "$JAR" | awk '{print $4}' | grep -iE 'font' | head -40
        echo "──────── классы стилей текста"
        unzip -l "$JAR" | awk '{print $4}' | grep -E 'LabelStyle|TextStyle|TextButtonStyle' | grep -v '\$' | head -20
        echo "──────── ассеты и их типы"
        unzip -l "$JAR" | awk '{print $4}' | grep -iE 'assetstore|AssetType' | grep -v '\$' | head -30

    - name: Сигнатуры стилей
      run: |
        set +e
        CP=$(find ~/.gradle/caches -name '*.jar' | grep -iv sources | grep -i hytale | tr '\n' ':')
        for C in $(unzip -l $(find ~/.gradle/caches -name 'Server-*.jar' | head -1) \
                    | awk '{print $4}' | grep -E 'LabelStyle\.class|FontStyle\.class|Font\.class|FontAsset\.class' \
                    | sed 's|/|.|g; s|\.class$||' | head -6); do
          echo "════════ $C"
          javap -cp "$CP" "$C" 2>&1 | head -40
        done
