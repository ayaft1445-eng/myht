name: Build plugin jar

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Build plugin
      run: ./gradlew build

    - name: Show jar contents
      run: unzip -l build/libs/*.jar

    - name: Upload plugin jar as artifact
      uses: actions/upload-artifact@v4
      with:
        name: ServerHub-plugin
        path: build/libs/*.jar
        if-no-files-found: error

    # Кладём собранный jar в Releases, чтобы его можно было скачать одной ссылкой:
    # https://github.com/ayaft1445-eng/myht/releases/latest
    - name: Publish jar to Releases
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        JARS=$(ls build/libs/*.jar | grep -v -- '-sources.jar' | grep -v -- '-javadoc.jar')
        echo "Публикуем: $JARS"
        gh release delete serverhub-latest --yes --cleanup-tag || true
        gh release create serverhub-latest $JARS \
          --target "$GITHUB_SHA" \
          --title "ServerHub — последняя сборка" \
          --notes "Меню сервера для Hytale: три раздела.

        Что делает: команда /hub открывает меню сервера с тремя кнопками — Правила, Мини-игры, Дискорд сервер. Нажатие на кнопку открывает окно с этим разделом.

        Как поставить: скачайте файл .jar ниже и положите его в папку plugins/ вашего сервера, затем перезапустите сервер. Старый файл плагина из папки удалите.

        Инструкция целиком: INSTALL-RU.md в репозитории."
