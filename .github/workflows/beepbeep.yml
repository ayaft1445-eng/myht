# Сборка мода машин BeepBeep VehicleCore, который лежит в папке beepbeep/.
#
# Каждый пуш в эту папку собирает jar против настоящего сервера Hytale.
# Релиз beepbeep-latest обновляется только коммитом с пометкой [release]
# в сообщении, чтобы промежуточные сборки не попадали в ссылку для скачивания.
name: Build BeepBeep VehicleCore

on:
  push:
    branches: [ "**" ]
    paths:
      - 'beepbeep/**'
      - '.github/workflows/beepbeep.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: beepbeep
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Build plugin
      run: ./gradlew build --console=plain

    - name: Show jar contents
      run: unzip -l build/libs/*.jar

    - name: Upload plugin jar as artifact
      uses: actions/upload-artifact@v4
      with:
        name: BeepBeep-VehicleCore
        path: beepbeep/build/libs/*.jar
        if-no-files-found: error

    - name: Publish jar to Releases
      if: github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        JARS=$(ls build/libs/*.jar | grep -v -- '-sources.jar' | grep -v -- '-javadoc.jar')
        echo "Публикуем: $JARS"
        gh release delete beepbeep-latest --yes --cleanup-tag || true
        gh release create beepbeep-latest $JARS \
          --target "$GITHUB_SHA" \
          --title "BeepBeep VehicleCore — последняя сборка" \
          --notes "Ядро машин BeepBeep: подвеска, коллизии кузова и посадка на несколько мест.

        Как поставить: скачайте .jar ниже, положите в папку mods/ (или plugins/) сервера рядом с BeepBeep_Vehicle_Pack и перезапустите сервер. Старый BeepBeep.VehicleCore-*.jar удалите.

        Посадка: подойдите к машине и нажмите F (Использовать) или /vehicle mount. Выход — удерживать приседание (Ctrl) или /vehicle dismount.

        Подробности: beepbeep/README.md в репозитории."
