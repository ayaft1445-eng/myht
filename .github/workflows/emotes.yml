# Сборка мода танцевальных эмоций DanceEmotes, который лежит в папке emotes/.
#
# Каждый пуш в эту папку собирает jar против настоящего сервера Hytale
# и выкладывает его в релиз danceemotes-latest.
name: Build DanceEmotes

on:
  push:
    branches: [ "**" ]
    paths:
      - 'emotes/**'
      - '.github/workflows/emotes.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: emotes
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Build plugin
      run: ./gradlew build --console=plain

    - name: Show jar contents
      run: unzip -l build/libs/*.jar

    - name: Upload plugin jar as artifact
      uses: actions/upload-artifact@v4
      with:
        name: DanceEmotes
        path: emotes/build/libs/*.jar
        if-no-files-found: error

    - name: Publish jar to Releases
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        JARS=$(ls build/libs/*.jar | grep -v -- '-sources.jar' | grep -v -- '-javadoc.jar')
        echo "Публикуем: $JARS"
        gh release delete danceemotes-latest --yes --cleanup-tag || true
        gh release create danceemotes-latest $JARS \
          --target "$GITHUB_SHA" \
          --title "DanceEmotes — последняя сборка" \
          --notes "Три танца для меню эмоций Hytale: орк, пандарен, дворф.

        Как поставить: скачайте .jar ниже, положите в папку mods/ сервера (или своего мира) и перезапустите. Танцы появятся в обычном меню эмоций; также работает команда /emote Dance_Orc, /emote Dance_Pandaren, /emote Dance_Dwarf."
